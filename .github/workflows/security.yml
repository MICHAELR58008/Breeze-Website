name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Gitleaks - Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep - SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
      - run: semgrep ci --json -o semgrep-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  trivy:
    name: Trivy - Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH
          format: json
          output: trivy-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

  bearer:
    name: Bearer - PII & Privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bearer/bearer-action@v2
        with:
          format: json
          output: bearer-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: bearer-report
          path: bearer-report.json

  verify:
    name: Verification Summary
    needs: [gitleaks, semgrep, trivy, bearer]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          echo "# Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks (Secrets) | ${{ needs.gitleaks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep (SAST) | ${{ needs.semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy (Dependencies) | ${{ needs.trivy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bearer (PII) | ${{ needs.bearer.result }} |" >> $GITHUB_STEP_SUMMARY
